<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Jornada - A promessa e o preço</title>
<meta name="description" content="Em 7 paradas curtas, entenda como o fascismo convenceu milhões de pessoas e o que ele entregou. Uma tela por vez, com áudio.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icones/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icones/favicon-192.png">
<link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
<meta name="theme-color" content="#18213f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/jornada.css">
</head>
<body>
<header class="barra">
  <button class="bt-ic" id="bt-mapa" type="button" aria-label="Voltar ao mapa da jornada"></button>
  <div class="prog" id="prog" role="img" aria-label="Progresso"></div>
  <button class="bt-ic" id="bt-letra" type="button" aria-label="Aumentar ou diminuir a letra">A+</button>
  <button class="bt-ic" id="bt-tema" type="button" aria-label="Trocar entre tema claro e escuro"></button>
</header>

<main id="palco" aria-live="polite"></main>

<nav class="pe" id="pe" aria-label="Navegação da jornada">
  <button class="bt bt-sec" id="bt-voltar" type="button"></button>
  <button class="bt bt-som" id="bt-ouvir" type="button"></button>
  <button class="bt bt-pri" id="bt-seguir" type="button"></button>
</nav>
